name: Build Android app
# Builds and tests the APK on every push and keeps it as a downloadable artifact.
# Releases are published by hand with the project's signing key, so installed
# copies of the app can update in place instead of having to be uninstalled.

on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Name it Echchara.apk
        run: cp app/build/outputs/apk/release/app-release.apk Echchara.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Echchara-apk
          path: Echchara.apk
